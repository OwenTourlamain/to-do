name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg APP_VERSION=ci --build-arg RELEASE_CHANNEL=ci -t todo-server:ci server
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 todo-server:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/version | grep -q '"channel":"ci"'
          curl -sf http://127.0.0.1:8000/ | grep -q 'Version ci (ci)'
      - name: Container logs
        if: failure()
        run: docker logs smoke
