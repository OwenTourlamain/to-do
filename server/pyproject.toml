[project]
name = "todo-server"
version = "0.1.0"
description = "Self-hosted task and reminder server"
readme = "README.md"
authors = [
    { name = "Owen Tourlamain", email = "6031186+OwenTourlamain@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
todo-server = "todo_server:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
